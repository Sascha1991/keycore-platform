name: keycore-${KEYCORE_DEPLOYMENT_ID:?KEYCORE_DEPLOYMENT_ID is required}

services:
  wordpress:
    image: wordpress:7.0.3-php8.3-apache
    depends_on:
      wordpress-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycore-storefront:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: keycore_staging_wp
      WORDPRESS_DB_USER: keycore_staging_wp
      WORDPRESS_DB_PASSWORD: ${KEYCORE_STAGING_WORDPRESS_DB_PASSWORD:?staging WordPress DB password is required}
      WORDPRESS_DEBUG: "0"
      KEYRANO_STAGING_BRIDGE_URL: http://keycore-storefront:3000
      KEYRANO_STAGING_BRIDGE_SECRET: ${KEYRANO_STAGING_BRIDGE_SECRET:?staging bridge secret is required}
      KEYRANO_STAGING_ORIGIN: ${KEYRANO_STAGING_ORIGIN:?explicit staging origin is required}
      KEYRANO_STAGING_FORCE_SSL_ADMIN: ${KEYRANO_STAGING_FORCE_SSL_ADMIN:-true}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'staging');
        define('DISALLOW_FILE_EDIT', true);
        $$keyrano_force_ssl_admin = strtolower((string) getenv('KEYRANO_STAGING_FORCE_SSL_ADMIN'));
        if (!in_array($$keyrano_force_ssl_admin, ['true', 'false'], true)) {
          throw new RuntimeException('KEYRANO_STAGING_FORCE_SSL_ADMIN must be true or false');
        }
        $$keyrano_staging_origin = parse_url((string) getenv('KEYRANO_STAGING_ORIGIN'));
        $$keyrano_local_http = is_array($$keyrano_staging_origin)
          && 'http' === ($$keyrano_staging_origin['scheme'] ?? '')
          && in_array($$keyrano_staging_origin['host'] ?? '', ['localhost', '127.0.0.1', '::1'], true);
        if ('false' === $$keyrano_force_ssl_admin && !$$keyrano_local_http) {
          throw new RuntimeException('Disabling FORCE_SSL_ADMIN is limited to local HTTP staging');
        }
        define('FORCE_SSL_ADMIN', 'true' === $$keyrano_force_ssl_admin);
    ports:
      - "127.0.0.1:${KEYCORE_STAGING_WORDPRESS_PORT:-18080}:80"
    volumes:
      - wordpress-data:/var/www/html
      - ../../apps/wordpress/keycore-platform:/var/www/html/wp-content/plugins/keycore-platform:ro

  keycore-checkout-bootstrap:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.staging-storefront
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCORE_ENV: STAGING
      KEYCORE_DEPLOYMENT_ID: ${KEYCORE_DEPLOYMENT_ID:?staging deployment ID is required}
      KEYCORE_STAGING_POSTGRES_PASSWORD: ${KEYCORE_STAGING_POSTGRES_PASSWORD:?staging PostgreSQL password is required}
    command:
      ["node", "--import", "tsx", "scripts/staging-checkout-bootstrap.ts"]
    restart: "no"

  keycore-storefront:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.staging-storefront
    depends_on:
      keycore-checkout-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KEYCORE_ENV: STAGING
      KEYCORE_DEPLOYMENT_ID: ${KEYCORE_DEPLOYMENT_ID:?staging deployment ID is required}
      KEYCORE_STAGING_POSTGRES_PASSWORD: ${KEYCORE_STAGING_POSTGRES_PASSWORD:?staging PostgreSQL password is required}
      KEYRANO_STAGING_BRIDGE_PORT: 3000
      KEYRANO_STAGING_BRIDGE_SECRET: ${KEYRANO_STAGING_BRIDGE_SECRET:?staging bridge secret is required}
      KEYRANO_STAGING_ORIGIN: ${KEYRANO_STAGING_ORIGIN:?explicit staging origin is required}
      KEYRANO_STAGING_BROWSER_MASTER_KEY: ${KEYRANO_STAGING_BROWSER_MASTER_KEY:?staging browser master key is required}
      KEYRANO_STAGING_SYNTHETIC_KEY: ${KEYRANO_STAGING_SYNTHETIC_KEY:?synthetic staging key is required}
      KEYRANO_STAGING_CUSTOMER_A_WP_USER_ID: ${KEYRANO_STAGING_CUSTOMER_A_WP_USER_ID:-2}
      KEYRANO_STAGING_CUSTOMER_B_WP_USER_ID: ${KEYRANO_STAGING_CUSTOMER_B_WP_USER_ID:-3}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  wordpress-db:
    image: mariadb:11.8.8
    environment:
      MARIADB_DATABASE: keycore_staging_wp
      MARIADB_USER: keycore_staging_wp
      MARIADB_PASSWORD: ${KEYCORE_STAGING_WORDPRESS_DB_PASSWORD:?staging WordPress DB password is required}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - wordpress-db-data:/var/lib/mysql

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: keycore_staging
      POSTGRES_USER: keycore_staging
      POSTGRES_PASSWORD: ${KEYCORE_STAGING_POSTGRES_PASSWORD:?staging PostgreSQL password is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycore_staging -d keycore_staging"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${KEYCORE_STAGING_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$KEYCORE_STAGING_REDIS_PASSWORD"
    environment:
      KEYCORE_STAGING_REDIS_PASSWORD: ${KEYCORE_STAGING_REDIS_PASSWORD:?staging Redis password is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$KEYCORE_STAGING_REDIS_PASSWORD redis-cli ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${KEYCORE_STAGING_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data

  mail:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:${KEYCORE_STAGING_MAIL_UI_PORT:-18025}:8025"
      - "127.0.0.1:${KEYCORE_STAGING_MAIL_SMTP_PORT:-11025}:1025"

  wordpress-bootstrap:
    image: wordpress:cli-2.12.0-php8.3
    user: "33:33"
    profiles: ["bootstrap"]
    depends_on:
      wordpress:
        condition: service_started
      wordpress-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: keycore_staging_wp
      WORDPRESS_DB_USER: keycore_staging_wp
      WORDPRESS_DB_PASSWORD: ${KEYCORE_STAGING_WORDPRESS_DB_PASSWORD:?staging WordPress DB password is required}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      KEYRANO_STAGING_ORIGIN: ${KEYRANO_STAGING_ORIGIN:?explicit staging origin is required}
      KEYRANO_STAGING_BRIDGE_URL: http://keycore-storefront:3000
      KEYRANO_STAGING_BRIDGE_SECRET: ${KEYRANO_STAGING_BRIDGE_SECRET:?staging bridge secret is required}
      KEYRANO_STAGING_ADMIN_USER: ${KEYRANO_STAGING_ADMIN_USER:?staging admin user is required}
      KEYRANO_STAGING_ADMIN_PASSWORD: ${KEYRANO_STAGING_ADMIN_PASSWORD:?staging admin password is required}
      KEYRANO_STAGING_CUSTOMER_A_PASSWORD: ${KEYRANO_STAGING_CUSTOMER_A_PASSWORD:?customer A staging password is required}
      KEYRANO_STAGING_CUSTOMER_B_PASSWORD: ${KEYRANO_STAGING_CUSTOMER_B_PASSWORD:?customer B staging password is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until wp db check --path=/var/www/html >/dev/null 2>&1; do sleep 2; done;
        if ! wp core is-installed --path=/var/www/html; then
          wp core install --path=/var/www/html --url="$$KEYRANO_STAGING_ORIGIN" --title="KeyRaNo" --admin_user="$$KEYRANO_STAGING_ADMIN_USER" --admin_password="$$KEYRANO_STAGING_ADMIN_PASSWORD" --admin_email="admin@example.test" --skip-email;
        fi;
        wp plugin install woocommerce --version=11.0.0 --activate --path=/var/www/html;
        wp language core install de_DE --activate --path=/var/www/html;
        wp language plugin install woocommerce de_DE --path=/var/www/html;
        wp plugin activate keycore-platform --path=/var/www/html;
        if ! wp user get keyrano-customer-a --path=/var/www/html >/dev/null 2>&1; then
          wp user create keyrano-customer-a customer-a@example.test --role=customer --user_pass="$$KEYRANO_STAGING_CUSTOMER_A_PASSWORD" --path=/var/www/html;
        fi;
        if ! wp user get keyrano-customer-b --path=/var/www/html >/dev/null 2>&1; then
          wp user create keyrano-customer-b customer-b@example.test --role=customer --user_pass="$$KEYRANO_STAGING_CUSTOMER_B_PASSWORD" --path=/var/www/html;
        fi;
        test "$$(wp user get keyrano-customer-a --field=ID --path=/var/www/html)" = "${KEYRANO_STAGING_CUSTOMER_A_WP_USER_ID:-2}";
        test "$$(wp user get keyrano-customer-b --field=ID --path=/var/www/html)" = "${KEYRANO_STAGING_CUSTOMER_B_WP_USER_ID:-3}";
        wp user meta update keyrano-customer-a _keyrano_customer_id 10000000-0000-4000-8000-000000000001 --path=/var/www/html;
        wp user meta update keyrano-customer-b _keyrano_customer_id 10000000-0000-4000-8000-000000000002 --path=/var/www/html;
        wp rewrite structure '/%postname%/' --hard --path=/var/www/html;
        wp option update timezone_string Europe/Berlin --path=/var/www/html;
        wp option update date_format 'd-m-Y' --path=/var/www/html;
        wp option update woocommerce_currency EUR --path=/var/www/html;
        wp option update woocommerce_currency_pos right_space --path=/var/www/html;
        wp option update woocommerce_price_thousand_sep '.' --path=/var/www/html;
        wp option update woocommerce_price_decimal_sep ',' --path=/var/www/html;
        wp option update woocommerce_default_country DE --path=/var/www/html;
        wp option update woocommerce_default_customer_address base --path=/var/www/html;
        wp option update woocommerce_allowed_countries specific --path=/var/www/html;
        wp option update woocommerce_specific_allowed_countries '["DE"]' --format=json --path=/var/www/html;
        wp option update woocommerce_coming_soon no --path=/var/www/html;
        wp post update "$$(wp option get woocommerce_myaccount_page_id --path=/var/www/html)" --post_title='Mein Konto' --path=/var/www/html;
        wp post update "$$(wp option get woocommerce_cart_page_id --path=/var/www/html)" --post_title='Warenkorb' --path=/var/www/html;
        wp post delete "$$(wp post list --post_type=page --name=sample-page --field=ID --path=/var/www/html)" --force --path=/var/www/html 2>/dev/null || true;
        wp option update show_on_front page --path=/var/www/html;
        wp option update page_on_front "$$(wp option get woocommerce_shop_page_id --path=/var/www/html)" --path=/var/www/html;
        wp transient delete keyrano_catalog_synced --path=/var/www/html || true;
        wp eval '(new KeyRaNo\Storefront\Publisher(new KeyRaNo\Storefront\Bridge_Client()))->sync();' --path=/var/www/html;
        wp rewrite flush --hard --path=/var/www/html
    volumes:
      - wordpress-data:/var/www/html
      - ../../apps/wordpress/keycore-platform:/var/www/html/wp-content/plugins/keycore-platform:ro

volumes:
  wordpress-data:
  wordpress-db-data:
  postgres-data:
  redis-data:
