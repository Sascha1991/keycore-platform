name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    name: Node foundation checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: keycore_test
          POSTGRES_PASSWORD: keycore_test_password
          POSTGRES_USER: keycore_test
        options: >-
          --health-cmd "pg_isready -U keycore_test -d keycore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      KEYCORE_TEST_DATABASE_URL: postgres://keycore_test:keycore_test_password@localhost:5432/keycore_test
      KEYCORE_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run check
      - name: Run KS-11-02 acceptance suite
        run: npm run e2e:acceptance
      - name: Archive safe KS-11-02 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ks-11-02-e2e-acceptance-evidence
          path: artifacts/e2e-acceptance/
          if-no-files-found: error
          retention-days: 14

  php:
    name: PHP foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: composer validate --strict
      - run: find apps -name '*.php' -print0 | xargs -0 -n1 php -l

  docker-compose:
    name: Docker compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker/compose.yaml config
      - run: docker compose --env-file infra/docker/staging.env.example -f infra/docker/compose.staging.yaml config
