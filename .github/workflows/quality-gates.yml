name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    name: Node foundation checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: keycore_test
          POSTGRES_PASSWORD: keycore_test_password
          POSTGRES_USER: keycore_test
        options: >-
          --health-cmd "pg_isready -U keycore_test -d keycore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      KEYCORE_TEST_DATABASE_URL: postgres://keycore_test:keycore_test_password@localhost:5432/keycore_test
      KEYCORE_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Install PostgreSQL recovery client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          pg_dump --version
      - run: npm run check
      - name: Run KS-11-02 acceptance suite
        id: e2e_acceptance
        run: npm run e2e:acceptance
      - name: Archive safe KS-11-02 acceptance evidence
        if: always() && steps.e2e_acceptance.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ks-11-02-e2e-acceptance-evidence
          path: artifacts/e2e-acceptance/
          if-no-files-found: error
          retention-days: 14
      - name: Run KS-11-03 catalog scale validation
        id: catalog_scale
        run: npm run catalog:scale
        timeout-minutes: 20
      - name: Archive safe KS-11-03 catalog scale evidence
        if: always() && steps.catalog_scale.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ks-11-03-catalog-scale-evidence
          path: artifacts/catalog-scale/
          if-no-files-found: error
          retention-days: 14
      - name: Run KS-11-04 order concurrency validation
        id: order_concurrency
        run: npm run order:concurrency
        timeout-minutes: 15
      - name: Archive safe KS-11-04 order concurrency evidence
        if: always() && steps.order_concurrency.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ks-11-04-order-concurrency-evidence
          path: artifacts/order-concurrency/
          if-no-files-found: error
          retention-days: 14
      - name: Run KS-11-05 security assessment
        id: security_assessment
        run: npm run security:assessment
        timeout-minutes: 15
      - name: Archive safe KS-11-05 security assessment evidence
        if: always() && steps.security_assessment.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ks-11-05-security-assessment-evidence
          path: artifacts/security-assessment/
          if-no-files-found: error
          retention-days: 14
      - name: Run KS-11-06 recovery exercise
        id: recovery_exercise
        run: npm run recovery:exercise
        timeout-minutes: 15
      - name: Archive safe KS-11-06 recovery exercise evidence
        if: always() && steps.recovery_exercise.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ks-11-06-recovery-exercise-evidence
          path: artifacts/recovery-exercise/
          if-no-files-found: error
          retention-days: 14
      - name: Run KS-11-07 UAT package validation
        id: uat_validation
        run: npm run uat:validate
      - name: Archive safe KS-11-07 UAT preparation evidence
        if: always() && steps.uat_validation.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ks-11-07-uat-preparation-evidence
          path: artifacts/user-acceptance/
          if-no-files-found: error
          retention-days: 14

  php:
    name: PHP foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: composer validate --strict
      - run: find apps -name '*.php' -print0 | xargs -0 -n1 php -l

  docker-compose:
    name: Docker compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker/compose.yaml config
      - run: docker compose --env-file infra/docker/staging.env.example -f infra/docker/compose.staging.yaml config
