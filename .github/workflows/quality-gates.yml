name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    name: Node foundation checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: keycore_test
          POSTGRES_PASSWORD: keycore_test_password
          POSTGRES_USER: keycore_test
        options: >-
          --health-cmd "pg_isready -U keycore_test -d keycore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      KEYCORE_TEST_DATABASE_URL: postgres://keycore_test:keycore_test_password@localhost:5432/keycore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - run: npm run check

  php:
    name: PHP foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: composer validate --strict
      - run: find apps -name '*.php' -print0 | xargs -0 -n1 php -l

  docker-compose:
    name: Docker compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker/compose.yaml config
